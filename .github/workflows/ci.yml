name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check (bash -n)
        run: |
          bad=0
          for f in install.sh bin/vpnsetup lib/*.sh lib/panels/*.sh tests/smoke.sh web/deploy/install.sh; do
            bash -n "$f" || { echo "FAIL: $f"; bad=1; }
          done
          exit "$bad"

      - name: Smoke tests
        run: bash tests/smoke.sh

  shellcheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck (warnings only, never blocks merge)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build frontend (vite build, no vue-tsc)
        run: bun run build

      - name: Server selftest (auth flow, guards, SPA)
        run: |
          export WEB_ADMIN_PASSWORD_HASH=$(bun server/hash-password.ts secret123)
          bun server/selftest.ts
